# Hermes profile config — orchestrator
# Installed to: ~/.hermes/profiles/orchestrator/config.yaml

# Model is set here per-profile so each agent can be changed independently.
# To swap the orchestrator model, edit `model.default` below.
# The global ~/.hermes/config.yaml default is NOT used when this is set.
model:
  base_url: https://openrouter.ai/api/v1
  provider: openrouter
  api_mode: chat_completions
  default: nvidia/nemotron-3-nano-30b-a3b:free
  max_tokens: 16384

goals:
  max_turns: 40

toolsets:
  - terminal
  - web
  - skills
  - subagent
  - memory

approval:
  mode: auto

session:
  compression_after_turns: 25
  keep_last_turns: 20

context_files:
  # Hermes will auto-discover these in any project dir the orchestrator navigates
  - AGENTS.md
  - .hermes.md
