# Hermes profile config — orchestrator
# Installed to: ~/.hermes/profiles/orchestrator/config.yaml

model:
  base_url: https://chatgpt.com/backend-api/codex
  default: gpt-5.4
  provider: openai-codex

# Auxiliary models (optional). Cheaper model used for compression/summary tasks.
auxiliary:
  compression: gpt-5-mini

toolsets:
  - terminal
  - web
  - skills
  - subagent
  - memory

approval:
  mode: smart    # auto-approves safe commands, prompts on dangerous ones

session:
  compression_after_turns: 25
  keep_last_turns: 20

context_files:
  # Hermes will auto-discover these in any project dir the orchestrator navigates
  - AGENTS.md
  - .hermes.md
