# Hermes profile config — orchestrator
# Installed to: ~/.hermes/profiles/orchestrator/config.yaml

# Model is intentionally NOT set here.
# Configure the model once in ~/.hermes/config.yaml (global Hermes config).
# All Max Agency profiles inherit from there — see Human_Runbook.md § A4.

toolsets:
  - terminal
  - web
  - skills
  - subagent
  - memory

approval:
  mode: auto

session:
  compression_after_turns: 25
  keep_last_turns: 20

context_files:
  # Hermes will auto-discover these in any project dir the orchestrator navigates
  - AGENTS.md
  - .hermes.md
