# Hermes profile config — coder
# Installed to: ~/.hermes/profiles/coder/config.yaml

# Model is set here per-profile so each agent can be changed independently.
# To swap the coder model, edit `model.default` below.
# The global ~/.hermes/config.yaml default is NOT used when this is set.
model:
  base_url: https://openrouter.ai/api/v1
  provider: openrouter
  api_mode: chat_completions
  default: nvidia/nemotron-3-nano-30b-a3b:free
  max_tokens: 16384

goals:
  max_turns: 40

toolsets:
  - terminal
  - skills
  - memory

approval:
  mode: auto

session:
  compression_after_turns: 25
  keep_last_turns: 20

context_files:
  - AGENTS.md
  - .hermes.md
  - CODING_STANDARDS.md
