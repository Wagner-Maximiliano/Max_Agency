# Hermes profile config — coder
# Installed to: ~/.hermes/profiles/coder/config.yaml

# Model is set here per-profile so each agent can be changed independently.
# To swap the coder model, edit `model.default` below.
# The global ~/.hermes/config.yaml default is NOT used when this is set.
model:
  base_url: https://openrouter.ai/api/v1
  provider: openrouter
  api_mode: chat_completions
  # minimax/minimax-m3 = the V2 Model Roster "hermes bulk" model. The previous
  # free nemotron-nano-30b could not complete coder tasks (claimed issues, then
  # produced no branch / looped to its iteration cap). minimax-m3 is a capable
  # reasoning model (~$0.30/M in, $1.20/M out) accessible on this OpenRouter key.
  default: minimax/minimax-m3
  max_tokens: 16384

goals:
  max_turns: 40

toolsets:
  - terminal
  - skills
  - memory

approval:
  mode: auto

session:
  compression_after_turns: 25
  keep_last_turns: 20

context_files:
  - AGENTS.md
  - .hermes.md
  - CODING_STANDARDS.md
